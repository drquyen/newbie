<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Y khoa - Sao Cũng Được</title>
    <style>
        :root {
            --mint: #a7ffeb;
            --dark-teal: #00796b;
            --glass: rgba(255, 255, 255, 0.25);
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e0f2f1 0%, #a7ffeb 100%);
            min-height: 100vh;
            color: #004d40;
        }

        /* Header & Login */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            background: var(--glass);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.3);
        }

        .login-btn {
            background: var(--dark-teal);
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .login-btn:hover { transform: scale(1.05); background: #004d40; }

        /* Main Content */
        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }

        .card {
            background: var(--glass);
            backdrop-filter: blur(15px);
            border-radius: 25px;
            padding: 30px;
            border: 1px solid rgba(255,255,255,0.4);
            box-shadow: 0 20px 40px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        h1, h2 { text-align: center; color: var(--dark-teal); }

        .calc-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 10px;
            border: 1px solid #b2dfdb;
            outline: none;
        }

        button.calc-exec {
            width: 100%;
            background: #4db6ac;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            background: rgba(255,255,255,0.5);
            border-radius: 10px;
            font-weight: bold;
            text-align: center;
            font-size: 1.2rem;
        }

        .tab-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .tab-btn {
            background: white;
            border: 1px solid var(--mint);
            padding: 8px 15px;
            border-radius: 15px;
            cursor: pointer;
        }

        .tab-btn.active { background: var(--dark-teal); color: white; }

        .calc-section { display: none; }
        .calc-section.active { display: block; animation: fadeIn 0.5s; }

        @keyframes fadeIn { from {opacity: 0;} to {opacity: 1;} }
    </style>
</head>
<body>

    <nav>
        <div style="font-weight: 900; font-size: 1.5rem;">SAO CŨNG ĐƯỢC</div>
        <button class="login-btn" onclick="alert('Chức năng đăng nhập đang phát triển!')">Đăng nhập</button>
    </nav>

    <div class="container">
        <div class="card">
            <h2>Công cụ tính toán Y khoa</h2>
            <div class="tab-buttons">
                <button class="tab-btn active" onclick="showTab('mdrd')">MDRD/GFR</button>
                <button class="tab-btn" onclick="showTab('haspled')">HAS-BLED</button>
                <button class="tab-btn" onclick="showTab('chadvasc')">CHA₂DS₂-VASc</button>
            </div>

            <div id="mdrd" class="calc-section active">
                <h3>Tính độ lọc cầu thận (MDRD)</h3>
                <input type="number" id="creatinine" placeholder="Creatinine máu (mg/dL)">
                <input type="number" id="age" placeholder="Tuổi">
                <select id="gender">
                    <option value="male">Nam</option>
                    <option value="female">Nữ</option>
                </select>
                <label><input type="checkbox" id="isBlack"> Người da đen?</label>
                <button class="calc-exec" onclick="calcMDRD()">Tính GFR</button>
                <div id="resMDRD" class="result">Kết quả: --</div>
            </div>

            <div id="haspled" class="calc-section">
                <h3>Thang điểm HAS-BLED</h3>
                <p style="font-size: 0.8rem;">(Chọn các yếu tố nguy cơ hiện có)</p>
                <div id="hasbled-list">
                    <label><input type="checkbox" class="hb" value="1"> Tăng huyết áp</label><br>
                    <label><input type="checkbox" class="hb" value="1"> Bất thường chức năng Gan/Thận (1đ mỗi loại)</label><br>
                    <label><input type="checkbox" class="hb" value="1"> Tiền sử đột quỵ</label><br>
                    <label><input type="checkbox" class="hb" value="1"> Tiền sử xuất huyết</label><br>
                    <label><input type="checkbox" class="hb" value="1"> INR dao động</label><br>
                    <label><input type="checkbox" class="hb" value="1"> Người già (>65 tuổi)</label><br>
                    <label><input type="checkbox" class="hb" value="1"> Thuốc/Rượu (1đ mỗi loại)</label>
                </div>
                <button class="calc-exec" onclick="calcHasBled()">Tính điểm</button>
                <div id="resHasBled" class="result">Điểm: 0</div>
            </div>

            <div id="chadvasc" class="calc-section">
                <h3>Thang điểm CHA₂DS₂-VASc</h3>
                <div id="chad-list">
                    <label><input type="checkbox" class="cv" value="1"> Suy tim (C)</label><br>
                    <label><input type="checkbox" class="cv" value="1"> Tăng huyết áp (H)</label><br>
                    <label><input type="checkbox" class="cv" value="2"> Tuổi >= 75 (A2)</label><br>
                    <label><input type="checkbox" class="cv" value="1"> Đái tháo đường (D)</label><br>
                    <label><input type="checkbox" class="cv" value="2"> Đột quỵ/Thuyên tắc (S2)</label><br>
                    <label><input type="checkbox" class="cv" value="1"> Bệnh mạch máu (V)</label><br>
                    <label><input type="checkbox" class="cv" value="1"> Tuổi 65-74 (A)</label><br>
                    <label><input type="checkbox" class="cv" value="1"> Nữ giới (Sc)</label>
                </div>
                <button class="calc-exec" onclick="calcChadVasc()">Tính điểm</button>
                <div id="resChad" class="result">Điểm: 0</div>
            </div>

        </div>
    </div>

    <script>
        function showTab(id) {
            document.querySelectorAll('.calc-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        // Công thức MDRD: GFR = 175 x (Scr)^-1.154 x (Age)^-0.203 x (0.742 if female) x (1.212 if black)
        function calcMDRD() {
            const scr = parseFloat(document.getElementById('creatinine').value);
            const age = parseInt(document.getElementById('age').value);
            const gender = document.getElementById('gender').value;
            const isBlack = document.getElementById('isBlack').checked;

            if(!scr || !age) return alert("Vui lòng nhập đủ thông tin");

            let gfr = 175 * Math.pow(scr, -1.154) * Math.pow(age, -0.203);
            if(gender === 'female') gfr *= 0.742;
            if(isBlack) gfr *= 1.212;

            document.getElementById('resMDRD').innerText = "GFR: " + gfr.toFixed(2) + " mL/min/1.73 m²";
        }

        function calcHasBled() {
            let score = 0;
            document.querySelectorAll('.hb:checked').forEach(i => score += parseInt(i.value));
            document.getElementById('resHasBled').innerText = "Điểm: " + score;
        }

        function calcChadVasc() {
            let score = 0;
            document.querySelectorAll('.cv:checked').forEach(i => score += parseInt(i.value));
            document.getElementById('resChad').innerText = "Điểm: " + score;
        }
    </script>
</body>
</html>

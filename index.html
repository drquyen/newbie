<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sao Cũng Được - 4D Mint</title>
    <style>
        :root {
            --mint: #a7ffeb;
            --dark-mint: #64ffda;
            --bg: #e0f2f1;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--bg);
            font-family: 'Montserrat', sans-serif;
            perspective: 1000px; /* Tạo không gian 3D */
            overflow: hidden;
        }

        /* Nền hiệu ứng 4D chuyển động */
        .background-animate {
            position: absolute;
            width: 150%;
            height: 150%;
            background: radial-gradient(circle, var(--mint) 0%, #ffffff 70%);
            z-index: -1;
            animation: moveBg 10s ease infinite alternate;
        }

        @keyframes moveBg {
            from { transform: translate(-10%, -10%) rotate(0deg); }
            to { transform: translate(10%, 10%) rotate(5deg); }
        }

        /* Khối chữ 4D */
        .card {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 50px 80px;
            border-radius: 30px;
            box-shadow: 0 25px 45px rgba(0,0,0,0.1);
            transform-style: preserve-3d;
            transition: 0.5s;
        }

        h1 {
            margin: 0;
            font-size: 5rem;
            color: #00897b;
            text-transform: uppercase;
            font-weight: 900;
            text-align: center;
            /* Đổ bóng chữ tạo độ nổi 4D */
            text-shadow: 
                0 1px 0 #ccc,
                0 2px 0 #c9c9c9,
                0 3px 0 #bbb,
                0 4px 0 #b9b9b9,
                0 5px 0 #aaa,
                0 6px 1px rgba(0,0,0,.1),
                0 0 5px rgba(0,0,0,.1),
                0 1px 3px rgba(0,0,0,.3),
                0 3px 5px rgba(0,0,0,.2),
                0 5px 10px rgba(0,0,0,.25),
                0 10px 10px rgba(0,0,0,.2),
                0 20px 20px rgba(0,0,0,.15);
            transform: translateZ(50px); /* Đẩy chữ nổi lên trên mặt phẳng */
        }

        .card:hover {
            transform: rotateX(10deg) rotateY(10deg);
            box-shadow: -10px 10px 50px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <div class="background-animate"></div>

    <div class="card">
        <h1>Sao cũng được</h1>
    </div>

</body>
</html>

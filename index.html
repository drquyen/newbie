<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sao Cũng Được</title>
    <style>
        /* Thiết lập nền và căn giữa nội dung */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        /* Hiệu ứng cho dòng chữ */
        .text-container {
            text-align: center;
            padding: 20px;
        }

        h1 {
            color: white;
            font-size: 5rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 5px;
            text-shadow: 0 10px 20px rgba(0,0,0,0.3);
            animation: fadeIn 2s ease-in-out, float 4s ease-in-out infinite;
        }

        /* Hiệu ứng mờ dần khi tải trang */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Hiệu ứng trôi lơ lửng nhẹ nhàng */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        /* Trang trí thêm một chút hạt sáng phía sau */
        .circles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .circles div {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: move 25s infinite linear;
        }

        @keyframes move {
            from { transform: translateY(0) rotate(0deg); opacity: 1; }
            to { transform: translateY(-1000px) rotate(720deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="text-container">
        <h1>Sao cũng được</h1>
    </div>

    <div class="circles">
        <div style="width: 80px; height: 80px; left: 10%; animation-delay: 0s;"></div>
        <div style="width: 120px; height: 120px; left: 20%; animation-delay: 2s; animation-duration: 12s;"></div>
        <div style="width: 50px; height: 50px; left: 70%; animation-delay: 4s;"></div>
        <div style="width: 150px; height: 150px; left: 85%; animation-delay: 0s; animation-duration: 18s;"></div>
    </div>

</body>
</html>
